name = "ddt-backend-worker"
main = "src/index.js"
compatibility_date = "2026-01-01"

[build]
command = "npm install"

[[d1_databases]]
binding = "DB"
database_name = "ddt-database"
database_id = "6f9f2d07-264b-43e6-9edf-ffd01c89f314"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = true
